<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} — Live</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #0d1b2a;
    --card: #1b263b;
    --border: #2a3a55;
    --accent: #8ecae6;
    --accent-soft: rgba(142, 202, 230, 0.12);
    --muted: #6c7a91;
    --live: #2ecc71;
    --history: #f4a261;
    --history-soft: rgba(244, 162, 97, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    margin: 0;
  }

  h1 { font-size: 24px; color: var(--accent); margin: 0 0 4px; }
  .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 22px; }

  #map {
    width: 94%;
    max-width: 1100px;
    height: 560px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    margin-bottom: 22px;
  }

  .card {
    background: var(--card);
    padding: 24px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    min-width: 280px;
  }
  .field {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    font-size: 18px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    gap: 30px;
  }
  .field:last-child { border-bottom: none; margin-bottom: 0; }
  .label { color: var(--accent); font-weight: bold; }
  .value { font-family: "Courier New", monospace; font-size: 18px; }
  .status {
    display: flex;
    align-items: center;
    margin: 16px 0 30px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 6px;
  }
  .dot.live { background: var(--live); }

  .toolbar {
    width: 94%;
    max-width: 1100px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--accent);
  }
  .toolbar label {
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    cursor: pointer;
  }
  .toolbar input[type="datetime-local"] {
    background: var(--bg);
    color: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  .toolbar input[type="datetime-local"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .toolbar button {
    background: var(--border);
    color: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .toolbar button:hover { background: #33456a; }

  .toolbar button#backToLive {
    background: var(--history-soft);
    color: var(--history);
  }
  .toolbar button#backToLive:hover { background: rgba(244, 162, 97, 0.22); }

  .toolbar-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
  }

  #historyBanner {
    display: none;
    width: 94%;
    max-width: 1100px;
    background: var(--history-soft);
    border: 1px solid var(--history);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<h1>{{ app_name }}</h1>
<div class="subtitle">modo: {{ role }}</div>

<div class="toolbar">
  <label>
    <input type="checkbox" id="followToggle" checked>
    Seguir camión
  </label>
  <button id="clearTrail">Limpiar recorrido</button>

  <div class="toolbar-divider"></div>

  <label>Desde:
    <input type="datetime-local" id="rangeStart">
  </label>
  <label>Hasta:
    <input type="datetime-local" id="rangeEnd">
  </label>
  <button id="searchHistory">Ver recorrido histórico</button>
  <button id="backToLive" style="display:none;">Volver a en vivo</button>
</div>

<div id="historyBanner"></div>

<div id="map"></div>

<div class="card">
  <div class="field"><span class="label">Latitude:</span><span class="value" id="lat">--</span></div>
  <div class="field"><span class="label">Longitude:</span><span class="value" id="lon">--</span></div>
  <div class="field"><span class="label">Date:</span><span class="value" id="date">--</span></div>
  <div class="field"><span class="label">Time:</span><span class="value" id="time">--</span></div>
</div>

<div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>

<script>

  const map = L.map("map").setView([4.6, -74.08], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  const marker = L.marker([4.6, -74.08]).addTo(map);

  // Polilínea que va trazando el recorrido real del vehículo en tiempo real.
  const trail = L.polyline([], { color: "#2ecc71", weight: 4, opacity: 0.85 }).addTo(map);

  // Polilínea separada para el recorrido histórico consultado por rango de
  // fecha/hora. smoothFactor suaviza el trazo que dibuja Leaflet, y además
  // aplicamos un suavizado propio (Catmull-Rom) antes de dibujarlo.
  const historyTrail = L.polyline([], {
    color: "#f4a261",
    weight: 4,
    opacity: 0.9,
    smoothFactor: 1.5
  }).addTo(map);

  let mapCentered = false;
  let followTruck = true;
  let viewingHistory = false;

  const followToggle = document.getElementById("followToggle");
  followToggle.addEventListener("change", () => {
    followTruck = followToggle.checked;

    if (followTruck) {
      map.panTo(marker.getLatLng());
    }
  });

  map.on("dragstart", () => {
    followTruck = false;
    followToggle.checked = false;
  });

  document.getElementById("clearTrail").addEventListener("click", () => {
    trail.setLatLngs([]);
  });

  function updateFields(data) {
    document.getElementById("lat").textContent  = data.lat  !== null ? data.lat  : "--";
    document.getElementById("lon").textContent  = data.lon  !== null ? data.lon  : "--";
    document.getElementById("date").textContent = data.date !== null ? data.date : "--";
    document.getElementById("time").textContent = data.time !== null ? data.time : "--";
    document.getElementById("status").textContent = "Live — last update " + new Date().toLocaleTimeString();
    document.getElementById("dot").classList.add("live");
  }

  function updateMap(lat, lon, addToTrail = true) {
    const point = [lat, lon];
    marker.setLatLng(point);

    if (addToTrail) {
      trail.addLatLng(point);
    }

    if (!mapCentered) {
      map.setView(point, 15);
      mapCentered = true;
    } else if (followTruck) {
      map.panTo(point, { animate: true, duration: 0.5 });
    }
  }

  // Suavizado tipo Catmull-Rom: convierte una lista de puntos "en zigzag"
  // (por el ruido normal del GPS) en una curva más natural, sin depender
  // de ninguna librería adicional. Corre en el navegador del usuario.
  function catmullRomSpline(points, segments = 8) {
    if (points.length < 3) return points;
    const result = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? i : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

      for (let t = 0; t < segments; t++) {
        const st = t / segments, st2 = st * st, st3 = st2 * st;
        const lat = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * st +
          (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * st2 +
          (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * st3);
        const lon = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * st +
          (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * st2 +
          (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * st3);
        result.push([lat, lon]);
      }
    }
    result.push(points[points.length - 1]);
    return result;
  }

  // --- Búsqueda de recorrido histórico por rango de fecha/hora ---

  document.getElementById("searchHistory").addEventListener("click", () => {
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    const banner = document.getElementById("historyBanner");

    if (!start || !end) {
      alert("Selecciona fecha y hora de inicio y fin");
      return;
    }

    fetch(`/api/history_range?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          alert(data.error);
          return;
        }

        const latlngs = data.points.map((p) => [p.lat, p.lon]);
        const smoothed = catmullRomSpline(latlngs, 8);

        viewingHistory = true;
        trail.setLatLngs([]); // oculta el trazo en vivo mientras se ve el histórico
        historyTrail.setLatLngs(smoothed);

        if (latlngs.length > 0) {
          map.fitBounds(historyTrail.getBounds(), { maxZoom: 15, padding: [20, 20] });
          banner.style.display = "block";
          banner.textContent = `Mostrando recorrido histórico: ${data.count} puntos entre ${start.replace("T", " ")} y ${end.replace("T", " ")}`;
        } else {
          banner.style.display = "block";
          banner.textContent = "No hay puntos registrados en ese rango de fechas";
        }

        document.getElementById("backToLive").style.display = "inline-block";
      })
      .catch(() => alert("Error consultando el historial"));
  });

  document.getElementById("backToLive").addEventListener("click", () => {
    viewingHistory = false;
    historyTrail.setLatLngs([]);
    document.getElementById("backToLive").style.display = "none";
    document.getElementById("historyBanner").style.display = "none";

    fetch("/api/history")
      .then((r) => r.json())
      .then((points) => trail.setLatLngs(points.map((p) => [p.lat, p.lon])));
  });

  // 1) Cargar el historial para dibujar el recorrido ya hecho antes de conectarnos en vivo.
  fetch("/api/history")
    .then((r) => r.json())
    .then((points) => {
      const latlngs = points.map((p) => [p.lat, p.lon]);
      trail.setLatLngs(latlngs);
      if (latlngs.length > 0) {
        const last = latlngs[latlngs.length - 1];
        marker.setLatLng(last);
        map.fitBounds(trail.getBounds(), { maxZoom: 15, padding: [20, 20] });
        mapCentered = true;
      }
    })
    .catch(() => {});

  // 2) Traer el último dato conocido para los campos de texto.
  fetch("/api/latest")
    .then((r) => r.json())
    .then((data) => {
      updateFields(data);
      if (data.lat !== null && data.lon !== null) {
        // No lo volvemos a añadir al trail: ya vino incluido en /api/history.
        updateMap(data.lat, data.lon, false);
      }
    })
    .catch(() => {});

  // 3) Suscribirse a las actualizaciones en vivo (Server-Sent Events) y extender el recorrido.
  const source = new EventSource("/events");

  source.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // El writer se reinició: empieza una sesión/recorrido nuevo.
    // Borramos el trazo aunque la página ya estuviera abierta, sin recargar.
    if (data.type === "session_start") {
      trail.setLatLngs([]);
      mapCentered = false;
      document.getElementById("status").textContent = "Nueva sesión de recorrido iniciada";
      return;
    }

    updateFields(data);
    if (data.lat !== null && data.lon !== null && !viewingHistory) {
      updateMap(data.lat, data.lon, true);
    }
  };

  source.onerror = () => {
    document.getElementById("dot").classList.remove("live");
    document.getElementById("status").textContent = "Connection lost — retrying…";
  };
</script>

</body>
</html>
