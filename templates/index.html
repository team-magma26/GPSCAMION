<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} — Live</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d2a1c;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    margin: 0;
  }
  h1 { font-size: 22px; color: #8ecae6; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #6c7a91; margin-bottom: 20px; }

  #map {
    width: 90%;
    max-width: 900px;
    height: 420px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    margin-bottom: 24px;
  }

  .card {
    background: #1b263b;
    padding: 24px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    min-width: 280px;
  }
  .field {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    font-size: 18px;
    border-bottom: 1px solid #2a3a55;
    padding-bottom: 8px;
    gap: 30px;
  }
  .label { color: #8ecae6; font-weight: bold; }
  .value { font-family: "Courier New", monospace; font-size: 18px; }
  .status { margin: 16px 0 30px; font-size: 13px; color: #6c7a91; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #6c7a91; margin-right: 6px;
  }
  .dot.live { background: #2ecc71; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #8ecae6;
  }
  .toolbar label {
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    cursor: pointer;
  }
  .toolbar button {
    background: #2a3a55;
    color: #8ecae6;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #33456a; }
</style>
</head>
<body>

<h1>{{ app_name }}</h1>
<div class="subtitle">modo: {{ role }}</div>

<div class="toolbar">
  <label>
    <input type="checkbox" id="followToggle" checked>
    Seguir camión
  </label>
  <button id="clearTrail">Limpiar recorrido</button>
</div>

<div id="map"></div>

<div class="card">
  <div class="field"><span class="label">Latitude:</span><span class="value" id="lat">--</span></div>
  <div class="field"><span class="label">Longitude:</span><span class="value" id="lon">--</span></div>
  <div class="field"><span class="label">Date:</span><span class="value" id="date">--</span></div>
  <div class="field"><span class="label">Time:</span><span class="value" id="time">--</span></div>
</div>

<div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>

<script>

  const map = L.map("map").setView([4.6, -74.08], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  const marker = L.marker([4.6, -74.08]).addTo(map);

  // Polilínea que va trazando el recorrido real del vehículo en tiempo real.
  const trail = L.polyline([], { color: "#2ecc71", weight: 4, opacity: 0.85 }).addTo(map);

  let mapCentered = false;
  let followTruck = true;

  const followToggle = document.getElementById("followToggle");
  followToggle.addEventListener("change", () => {
    followTruck = followToggle.checked;

    if (followTruck) {
      map.panTo(marker.getLatLng());
    }
  });

  map.on("dragstart", () => {
    followTruck = false;
    followToggle.checked = false;
  });

  document.getElementById("clearTrail").addEventListener("click", () => {
    trail.setLatLngs([]);
  });

  function updateFields(data) {
    document.getElementById("lat").textContent  = data.lat  !== null ? data.lat  : "--";
    document.getElementById("lon").textContent  = data.lon  !== null ? data.lon  : "--";
    document.getElementById("date").textContent = data.date !== null ? data.date : "--";
    document.getElementById("time").textContent = data.time !== null ? data.time : "--";
    document.getElementById("status").textContent = "Live — last update " + new Date().toLocaleTimeString();
    document.getElementById("dot").classList.add("live");
  }

  function updateMap(lat, lon, addToTrail = true) {
    const point = [lat, lon];
    marker.setLatLng(point);

    if (addToTrail) {
      trail.addLatLng(point);
    }

    if (!mapCentered) {
      map.setView(point, 15);
      mapCentered = true;
    } else if (followTruck) {
      map.panTo(point, { animate: true, duration: 0.5 });
    }
  }

  // 1) Cargar el historial para dibujar el recorrido ya hecho antes de conectarnos en vivo.
  fetch("/api/history")
    .then((r) => r.json())
    .then((points) => {
      const latlngs = points.map((p) => [p.lat, p.lon]);
      trail.setLatLngs(latlngs);
      if (latlngs.length > 0) {
        const last = latlngs[latlngs.length - 1];
        marker.setLatLng(last);
        map.fitBounds(trail.getBounds(), { maxZoom: 15, padding: [20, 20] });
        mapCentered = true;
      }
    })
    .catch(() => {});

  // 2) Traer el último dato conocido para los campos de texto.
  fetch("/api/latest")
    .then((r) => r.json())
    .then((data) => {
      updateFields(data);
      if (data.lat !== null && data.lon !== null) {
        // No lo volvemos a añadir al trail: ya vino incluido en /api/history.
        updateMap(data.lat, data.lon, false);
      }
    })
    .catch(() => {});

  // 3) Suscribirse a las actualizaciones en vivo (Server-Sent Events) y extender el recorrido.
  const source = new EventSource("/events");

  source.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // El writer se reinició: empieza una sesión/recorrido nuevo.
    // Borramos el trazo aunque la página ya estuviera abierta, sin recargar.
    if (data.type === "session_start") {
      trail.setLatLngs([]);
      mapCentered = false;
      document.getElementById("status").textContent = "Nueva sesión de recorrido iniciada";
      return;
    }

    updateFields(data);
    if (data.lat !== null && data.lon !== null) {
      updateMap(data.lat, data.lon, true);
    }
  };

  source.onerror = () => {
    document.getElementById("dot").classList.remove("live");
    document.getElementById("status").textContent = "Connection lost — retrying…";
  };
</script>

</body>
</html>
