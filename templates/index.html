<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} — Live</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #0d1b2a;
    --card: #1b263b;
    --border: #2a3a55;
    --accent: #8ecae6;
    --accent-soft: rgba(142, 202, 230, 0.12);
    --muted: #6c7a91;
    --live: #2ecc71;
    --history: #f4a261;
    --history-soft: rgba(244, 162, 97, 0.14);
    --topbar-h: 78px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: #ffffff;
    margin: 0;
    padding-bottom: 40px;
  }

  /* ---------- Barra de título ---------- */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    position: relative;
    z-index: 20;
  }
  .topbar-inner {
    width: 94%;
    max-width: 1300px;
    margin: 0 auto;
    padding: 14px 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    min-height: 50px;
  }

  .hamburger-btn {
    width: 44px; height: 44px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    transition: background .15s;
  }
  .hamburger-btn:hover { background: var(--accent-soft); }
  .hamburger-btn svg { width: 22px; height: 22px; }

  .logo {
    width: 48px; height: 48px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--accent);
  }
  .logo svg { width: 28px; height: 28px; }
  .titles { flex: 1; min-width: 160px; }
  h1 { font-size: 22px; color: var(--accent); margin: 0; letter-spacing: .3px; }
  .role {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2); }

  /* ---------- Menú desplegable (hamburguesa): Opciones / En Vivo / Históricos ---------- */
  .nav-overlay {
    display: none;
    position: fixed;
    top: var(--topbar-h); left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.35);
    z-index: 3000;
  }
  .nav-overlay.open { display: block; }

  .nav-drawer {
    position: fixed;
    top: var(--topbar-h); bottom: 0; left: -260px;
    width: 240px;
    background: var(--card);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 18px rgba(0,0,0,.45);
    z-index: 3001;
    padding: 18px 16px;
    transition: left .22s ease;
  }
  .nav-drawer.open { left: 0; }
  .nav-drawer-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: bold;
    margin-bottom: 14px;
  }
  .nav-drawer-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background .15s, border-color .15s;
  }
  .nav-drawer-btn:hover { background: var(--accent-soft); }
  .nav-drawer-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ---------- Contenido general ---------- */
  .wrap { width: 94%; max-width: 1100px; margin: 22px auto 0; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 16px 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    margin-bottom: 14px;
  }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group.grow { flex: 1; }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: bold;
  }
  .group-body { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--accent); }
  .divider { width: 1px; align-self: stretch; background: var(--border); }

  /* Interruptor "Seguir camión" */
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .slider {
    width: 38px; height: 22px; border-radius: 999px;
    background: var(--border);
    position: relative;
    transition: background .2s;
  }
  .slider::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted);
    transition: transform .2s, background .2s;
  }
  .switch input:checked + .slider { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .switch input:checked + .slider::after { transform: translateX(16px); background: var(--accent); }

  .date-field { display: flex; align-items: center; gap: 8px; }
  input[type="datetime-local"] {
    background: var(--bg);
    color: #ffffff;
    color-scheme: dark;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input[type="datetime-local"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    background: var(--border);
    color: var(--accent);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #33456a; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.primary:hover { background: #a4d6ec; }
  .btn.history { background: var(--history-soft); color: var(--history); border-color: var(--history); }
  .btn.history:hover { background: rgba(244, 162, 97, 0.22); }
  .btn.block { width: 100%; }

  #historyBanner {
    display: none;
    background: var(--history-soft);
    border: 1px solid var(--history);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  #passagesBanner {
    display: none;
    background: var(--history-soft);
    border: 1px solid var(--history);
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  #passagesBanner ul { margin: 8px 0 0 18px; padding: 0; }
  #passagesBanner li { margin-bottom: 4px; }

  /* ---------- Modal de validación (reemplaza los alert() nativos) ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    padding: 22px 24px;
    max-width: 380px;
    width: 90%;
  }
  .modal-card p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #ffffff;
  }
  .modal-card .btn { width: 100%; }

  /* ---------- Tabla de recorridos ---------- */
  #routesTablePanel {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-top: 12px;
    max-height: 280px;
    overflow-y: auto;
  }
  #routesTablePanel.open { display: block; }
  table.routes-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.routes-table th {
    text-align: left;
    padding: 7px 8px;
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
  }
  table.routes-table td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.routes-table tr:last-child td { border-bottom: none; }
  table.routes-table tr.todos-row td {
    font-weight: bold;
    color: var(--accent);
  }
  table.routes-table input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .route-swatch {
    width: 12px; height: 12px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    vertical-align: middle;
  }

  /* Marcadores de inicio/fin de cada recorrido histórico */
  .route-endpoint {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: #0d1b2a;
    font-weight: bold;
    font-size: 11px;
    border: 2px solid #0d1b2a;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }

  #map {
    width: 100%;
    height: 100%;
    min-height: 560px;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  /* Camión como marcador del mapa */
  .truck-pin {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--accent);
    color: var(--accent);
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .truck-pin svg { width: 22px; height: 22px; }

  /* ---------- Vista "En Vivo": panel fusionado (control + posición actual) ---------- */
  .live-panel-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    width: 100%;
  }
  .live-badge {
    background: var(--accent);
    color: var(--bg);
    font-size: 15px;
    font-weight: bold;
    padding: 8px 18px;
    border-radius: 999px;
    letter-spacing: .3px;
  }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
  .label {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: bold;
  }
  .value { font-family: "Courier New", monospace; font-size: 20px; }

  /* ---------- Vista "Históricos": layout de dos columnas ---------- */
  .history-layout {
    width: 94%;
    max-width: 1300px;
    margin: 22px auto 0;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .history-sidebar {
    flex: 0 0 26%;
    max-width: 340px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 18px 20px;
  }
  .history-sidebar.collapsed { display: none; }
  .history-sidebar-title {
    font-size: 15px;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .history-sidebar h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 18px 0 10px;
  }
  .sidebar-dates { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .sidebar-dates .date-field { justify-content: space-between; }
  .sidebar-dates input[type="datetime-local"] { flex: 1; }
  .sidebar-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .sidebar-actions-row { display: flex; gap: 8px; }
  .sidebar-actions-row .btn { flex: 1; }

  .history-map-area {
    flex: 1;
    min-width: 0;
    position: relative;
  }
  .expand-sidebar-btn {
    display: none;
    position: absolute;
    top: 14px; left: 10px;
    z-index: 800;
    width: 34px; height: 34px;
    align-items: center; justify-content: center;
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .expand-sidebar-btn.visible { display: flex; }
  .collapse-sidebar-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    float: right;
  }
  .collapse-sidebar-btn:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 900px) {
    .history-layout { flex-direction: column; }
    .history-sidebar { flex-basis: auto; max-width: none; width: 100%; }
  }

  @media (max-width: 760px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    #map { min-height: 420px; }
    .divider { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="logo" id="logoIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6h13v10H1z"/>
        <path d="M14 9h4l3 3v4h-7z"/>
        <circle cx="6" cy="18" r="2"/>
        <circle cx="17" cy="18" r="2"/>
      </svg>
    </div>
    <div class="titles">
      <h1>{{ app_name }}</h1>
      <span class="role">modo: {{ role }}</span>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  </div>
</header>

<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-drawer" id="navDrawer">
  <div class="nav-drawer-title">Opciones</div>
  <button class="nav-drawer-btn active" id="navBtnLive" data-view="live">En Vivo</button>
  <button class="nav-drawer-btn" id="navBtnHistory" data-view="history">Históricos</button>
</nav>

<!-- ===================== VISTA: EN VIVO ===================== -->
<main class="wrap" id="liveView">

  <section class="panel">
    <div class="live-panel-header">
      <span class="live-badge">En Vivo</span>
      <label class="switch">
        <input type="checkbox" id="followToggle" checked>
        <span class="slider"></span>
        Seguir camión
      </label>
      <button class="btn" id="clearTrail">Limpiar recorrido</button>
    </div>
    <div class="stats-grid">
      <div><span class="label">Latitud</span><span class="value" id="lat">--</span></div>
      <div><span class="label">Longitud</span><span class="value" id="lon">--</span></div>
      <div><span class="label">Fecha</span><span class="value" id="date">--</span></div>
      <div><span class="label">Hora</span><span class="value" id="time">--</span></div>
    </div>
  </section>

  <div id="mapWrapLive" style="height:560px;">
    <!-- el div #map real se mueve aquí cuando la vista está en "live" -->
  </div>

</main>

<!-- ===================== VISTA: HISTÓRICOS ===================== -->
<div class="history-layout" id="historyView" style="display:none;">

  <aside class="history-sidebar" id="historySidebar">
    <button class="collapse-sidebar-btn" id="collapseSidebarBtn" title="Ocultar filtros">«</button>
    <div class="history-sidebar-title">Recorrido histórico</div>

    <div class="sidebar-dates">
      <label class="date-field">Desde <input type="datetime-local" id="historyStart"></label>
      <label class="date-field">Hasta <input type="datetime-local" id="historyEnd"></label>
    </div>

    <div class="sidebar-actions">
      <div class="sidebar-actions-row">
        <button class="btn primary" id="filterRoutesByDate">Filtrar por fecha</button>
        <button class="btn history" id="clearDateFilter">Limpiar búsqueda</button>
      </div>
    </div>

    <div id="historyBanner"></div>
    <div id="routesTablePanel">
      <table class="routes-table">
        <thead>
          <tr><th></th><th>Recorrido</th><th>Puntos</th></tr>
        </thead>
        <tbody id="routesTableBody">
          <tr class="todos-row">
            <td><input type="checkbox" id="routesTodosCheckbox"></td>
            <td colspan="2">Todos</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h4>Buscar por lugar</h4>
    <div class="sidebar-actions">
      <button class="btn block" id="pickLocationBtn">Seleccionar punto en el mapa</button>
      <button class="btn primary block" id="searchPassages">Buscar pasadas</button>
      <button class="btn history block" id="clearPassages" style="display:none;">Limpiar búsqueda</button>
    </div>
    <div id="passagesBanner"></div>
  </aside>

  <div class="history-map-area">
    <button class="expand-sidebar-btn" id="expandSidebarBtn" title="Mostrar filtros">»</button>
    <div id="mapWrapHistory" style="height:calc(100vh - 160px); min-height:560px;">
      <!-- el div #map real se mueve aquí cuando la vista está en "history" -->
    </div>
  </div>

</div>

<div class="modal-overlay" id="appModal">
  <div class="modal-card">
    <p id="modalMessage"></p>
    <button class="btn primary" id="modalOk">Entendido</button>
  </div>
</div>

<script>

  // ======================================================================
  // MAPA (única instancia, se reubica entre la vista "en vivo" y "históricos")
  // ======================================================================
  const mapEl = document.createElement("div");
  mapEl.id = "map";
  document.getElementById("mapWrapLive").appendChild(mapEl);

  const map = L.map(mapEl).setView([4.6, -74.08], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // El marcador reutiliza el mismo ícono de camión de la barra de título.
  const truckIcon = L.divIcon({
    className: "",
    html: '<div class="truck-pin">' + document.getElementById("logoIcon").innerHTML + "</div>",
    iconSize: [40, 40],
    iconAnchor: [20, 20],
  });
  const marker = L.marker([4.6, -74.08], { icon: truckIcon }).addTo(map);

  // Recorrido real del vehículo en tiempo real.
  const trail = L.polyline([], { color: "#2ecc71", weight: 4, opacity: 0.85 }).addTo(map);

  // Recorridos históricos (uno por cada sesión/recorrido ya guardado).
  const ROUTE_COLORS = ["#c2410c", "#2ecc71", "#8ecae6", "#e63946", "#ffb703", "#9b5de5", "#00b4d8", "#f4a261"];
  const routesLayer = L.layerGroup().addTo(map);
  const routesBySession = new Map(); // session_id -> { color, points, polyline, startMarker, endMarker, visible, loaded, loading }

  // ======================================================================
  // NAVEGACIÓN: menú hamburguesa + cambio de vista En Vivo / Históricos
  // ======================================================================
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const navDrawer = document.getElementById("navDrawer");
  const navOverlay = document.getElementById("navOverlay");
  const liveView = document.getElementById("liveView");
  const historyView = document.getElementById("historyView");
  const navBtnLive = document.getElementById("navBtnLive");
  const navBtnHistory = document.getElementById("navBtnHistory");

  function openNav() {
    navDrawer.classList.add("open");
    navOverlay.classList.add("open");
  }
  function closeNav() {
    navDrawer.classList.remove("open");
    navOverlay.classList.remove("open");
  }
  hamburgerBtn.addEventListener("click", () => {
    navDrawer.classList.contains("open") ? closeNav() : openNav();
  });
  navOverlay.addEventListener("click", closeNav);

  let currentView = "live";

  function setView(view) {
    const previousView = currentView;
    currentView = view;
    closeNav();

    if (view === "live") {
      liveView.style.display = "block";
      historyView.style.display = "none";
      navBtnLive.classList.add("active");
      navBtnHistory.classList.remove("active");
      document.getElementById("mapWrapLive").appendChild(mapEl);
      if (previousView === "history") exitHistoryMode();
    } else {
      liveView.style.display = "none";
      historyView.style.display = "flex";
      navBtnLive.classList.remove("active");
      navBtnHistory.classList.add("active");
      document.getElementById("mapWrapHistory").appendChild(mapEl);
    }

    // Leaflet necesita que se le avise tras cambiar el tamaño/contenedor real
    // de su div, o el mapa queda mal recortado hasta que el usuario interactúe.
    setTimeout(() => map.invalidateSize(), 60);
  }

  // Al volver a "En Vivo" se apaga por completo el modo histórico: se
  // desmarcan y borran todas las rutas dibujadas (para que no se sigan
  // viendo encima del camión en vivo), se limpia la búsqueda por lugar, y
  // se vuelve a traer el trazo en vivo actual — porque mientras se veía el
  // histórico, ese trazo se había vaciado (ver updateHistoryViewState) y
  // dejó de actualizarse con cada evento SSE (ver el "!viewingHistory" del
  // listener de /events).
  function exitHistoryMode() {
    todosCheckbox.checked = false;
    setAllRoutesVisible(false);

    lastPassages = [];
    passageMarkersLayer.clearLayers();
    document.getElementById("passagesBanner").style.display = "none";
    document.getElementById("clearPassages").style.display = "none";
    if (placeMarker) { map.removeLayer(placeMarker); placeMarker = null; }
    if (placeCircle) { map.removeLayer(placeCircle); placeCircle = null; }

    viewingHistory = false;

    fetch("/api/history")
      .then((r) => r.json())
      .then((points) => {
        const latlngs = points.map((p) => [p.lat, p.lon]);
        trail.setLatLngs(latlngs);
        if (latlngs.length > 0) {
          const last = latlngs[latlngs.length - 1];
          marker.setLatLng(last);
          if (followTruck) map.panTo(last, { animate: true, duration: 0.5 });
        }
      })
      .catch(() => {});
  }

  navBtnLive.addEventListener("click", () => setView("live"));
  navBtnHistory.addEventListener("click", () => setView("history"));

  // ---- Barra lateral de Históricos: colapsar / expandir ----
  const historySidebar = document.getElementById("historySidebar");
  const collapseSidebarBtn = document.getElementById("collapseSidebarBtn");
  const expandSidebarBtn = document.getElementById("expandSidebarBtn");

  collapseSidebarBtn.addEventListener("click", () => {
    historySidebar.classList.add("collapsed");
    expandSidebarBtn.classList.add("visible");
    setTimeout(() => map.invalidateSize(), 60);
  });
  expandSidebarBtn.addEventListener("click", () => {
    historySidebar.classList.remove("collapsed");
    expandSidebarBtn.classList.remove("visible");
    setTimeout(() => map.invalidateSize(), 60);
  });

  // ======================================================================
  // Modal de validación (reemplaza los alert() nativos)
  // ======================================================================
  const appModal = document.getElementById("appModal");
  const modalMessage = document.getElementById("modalMessage");
  document.getElementById("modalOk").addEventListener("click", () => appModal.classList.remove("open"));
  function showAlert(message) {
    modalMessage.textContent = message;
    appModal.classList.add("open");
  }

  function endpointIcon(letter, color) {
    return L.divIcon({
      className: "",
      html: `<div class="route-endpoint" style="background:${color}">${letter}</div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
    });
  }

  function drawRoute(route) {
    const latlngs = route.points.map((p) => [p.lat, p.lon]);

    route.polyline = L.polyline(catmullRomSpline(latlngs, 8), {
      color: route.color, weight: 4, opacity: 0.9, smoothFactor: 1.5,
    }).addTo(routesLayer);

    if (route.points.length > 0) {
      const first = route.points[0];
      const last = route.points[route.points.length - 1];

      route.startMarker = L.marker([first.lat, first.lon], { icon: endpointIcon("A", route.color) })
        .bindPopup(`<strong>Inicio</strong><br>${first.time}<br>Lat: ${first.lat.toFixed(5)}, Lon: ${first.lon.toFixed(5)}`)
        .addTo(routesLayer);

      route.endMarker = L.marker([last.lat, last.lon], { icon: endpointIcon("B", route.color) })
        .bindPopup(`<strong>Fin</strong><br>${last.time}<br>Lat: ${last.lat.toFixed(5)}, Lon: ${last.lon.toFixed(5)}`)
        .addTo(routesLayer);
    }
  }

  function undrawRoute(route) {
    if (route.polyline) routesLayer.removeLayer(route.polyline);
    if (route.startMarker) routesLayer.removeLayer(route.startMarker);
    if (route.endMarker) routesLayer.removeLayer(route.endMarker);
    route.polyline = null;
    route.startMarker = null;
    route.endMarker = null;
  }

  // El zoom/encuadre del mapa SOLO se recalcula cuando una ruta se agrega a
  // la vista (para que el usuario la vea completa la primera vez). Al
  // desmarcar una ruta nunca se llama esta función, así se respeta el zoom
  // que el usuario tenía puesto.
  function fitToVisibleRoutes() {
    const visiblePolylines = [...routesBySession.values()]
      .filter((r) => r.visible && r.polyline)
      .map((r) => r.polyline);
    if (visiblePolylines.length > 0) {
      map.fitBounds(L.featureGroup(visiblePolylines).getBounds(), { maxZoom: 15, padding: [20, 20] });
    }
  }

  function setRouteVisible(sessionId, desiredVisible) {
    const route = routesBySession.get(sessionId);
    if (!route) return;

    route.visible = desiredVisible;

    if (!desiredVisible) {
      undrawRoute(route);
      updateHistoryViewState();
      renderPassageMarkers(); // oculta también las pasadas que pertenecían a esta ruta
      return;
    }

    if (route.loaded) {
      if (!route.polyline) drawRoute(route);
      updateHistoryViewState();
      fitToVisibleRoutes();
      renderPassageMarkers();
      return;
    }

    if (route.loading) return; // ya hay un fetch en curso; él decide al terminar

    route.loading = true;
    fetch(`/api/session_route?session_id=${encodeURIComponent(sessionId)}`)
      .then((r) => r.json())
      .then((data) => {
        route.points = data.points || [];
        route.loaded = true;
        route.loading = false;
        if (route.visible) {
          drawRoute(route);
          fitToVisibleRoutes();
        }
        updateHistoryViewState();
        renderPassageMarkers();
      })
      .catch(() => { route.loading = false; });
  }

  function anyRouteVisible() {
    for (const route of routesBySession.values()) {
      if (route.visible) return true;
    }
    return false;
  }

  function updateHistoryViewState() {
    const active = anyRouteVisible();
    viewingHistory = active;

    const banner = document.getElementById("historyBanner");
    if (routesBySession.size === 0 && currentFilterLabel) {
      banner.style.display = "block";
      banner.textContent = `No hay recorridos guardados entre ${currentFilterLabel}`;
    } else {
      banner.style.display = "none";
    }

    if (active) {
      trail.setLatLngs([]); // oculta el trazo en vivo mientras se ven recorridos históricos
    }
  }

  let mapCentered = false;
  let followTruck = true;
  let viewingHistory = false;

  const followToggle = document.getElementById("followToggle");
  followToggle.addEventListener("change", () => {
    followTruck = followToggle.checked;

    if (followTruck) {
      map.panTo(marker.getLatLng());
    }
  });

  map.on("dragstart", () => {
    followTruck = false;
    followToggle.checked = false;
  });

  document.getElementById("clearTrail").addEventListener("click", () => {
    trail.setLatLngs([]);
  });

  function updateFields(data) {
    document.getElementById("lat").textContent  = data.lat  !== null ? data.lat  : "--";
    document.getElementById("lon").textContent  = data.lon  !== null ? data.lon  : "--";
    document.getElementById("date").textContent = data.date !== null ? data.date : "--";
    document.getElementById("time").textContent = data.time !== null ? data.time : "--";
    document.getElementById("status").textContent = "Live — last update " + new Date().toLocaleTimeString();
    document.getElementById("dot").classList.add("live");
  }

  function updateMap(lat, lon, addToTrail = true) {
    const point = [lat, lon];
    marker.setLatLng(point);

    if (addToTrail) {
      trail.addLatLng(point);
    }

    if (!mapCentered) {
      map.setView(point, 15);
      mapCentered = true;
    } else if (followTruck) {
      map.panTo(point, { animate: true, duration: 0.5 });
    }
  }

  // Suavizado tipo Catmull-Rom: convierte puntos "en zigzag" (ruido normal
  // del GPS) en una curva más natural. Corre en el navegador del usuario.
  function catmullRomSpline(points, segments = 8) {
    if (points.length < 3) return points;
    const result = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? i : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

      for (let t = 0; t < segments; t++) {
        const st = t / segments, st2 = st * st, st3 = st2 * st;
        const lat = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * st +
          (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * st2 +
          (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * st3);
        const lon = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * st +
          (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * st2 +
          (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * st3);
        result.push([lat, lon]);
      }
    }
    result.push(points[points.length - 1]);
    return result;
  }

  // --- Calendario bloqueado: nunca se puede elegir una fecha/hora futura ---

  function localDatetimeString(date) {
    const offsetMs = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offsetMs).toISOString().slice(0, 16);
  }

  function updateDateLimits() {
    const nowStr = localDatetimeString(new Date());
    document.getElementById("historyStart").max = nowStr;
    document.getElementById("historyEnd").max = nowStr;
  }
  updateDateLimits();
  setInterval(updateDateLimits, 30000);

  // --- Validación del rango de fecha/hora elegido, con popup en vez de alert() nativo ---

  function validateRange(start, end) {
    if (!start || !end) {
      showAlert("Selecciona fecha y hora de inicio y fin.");
      return false;
    }

    const nowStr = localDatetimeString(new Date());
    if (start > nowStr) {
      showAlert("La fecha/hora 'Desde' no puede ser futura.");
      return false;
    }
    if (end > nowStr) {
      showAlert("La fecha/hora 'Hasta' no puede ser futura.");
      return false;
    }
    if (start > end) {
      showAlert("La fecha/hora 'Desde' no puede ser posterior a 'Hasta'.");
      return false;
    }
    return true;
  }

  // --- Tabla de recorridos: un checkbox por recorrido guardado + "Todos" ---

  const todosCheckbox = document.getElementById("routesTodosCheckbox");
  const routesTableBody = document.getElementById("routesTableBody");
  const routesTablePanel = document.getElementById("routesTablePanel");

  function setAllRoutesVisible(visible) {
    routesTableBody.querySelectorAll("tr[data-session-id] input[type=checkbox]").forEach((cb) => {
      cb.checked = visible;
      setRouteVisible(cb.closest("tr").dataset.sessionId, visible);
    });
  }

  function syncTodosCheckbox() {
    const boxes = [...routesTableBody.querySelectorAll("tr[data-session-id] input[type=checkbox]")];
    todosCheckbox.checked = boxes.length > 0 && boxes.every((cb) => cb.checked);
  }

  todosCheckbox.addEventListener("change", () => {
    setAllRoutesVisible(todosCheckbox.checked);
  });

  let currentFilterLabel = null; // ej. "2026-09-20 08:00 → 2026-09-25 20:00", o null si no hay filtro

  function clearRoutesTable() {
    routesBySession.forEach((route) => undrawRoute(route));
    routesBySession.clear();
    routesTableBody.querySelectorAll("tr[data-session-id]").forEach((tr) => tr.remove());
    todosCheckbox.checked = false;
  }

  // Al cargar la página (o al quitar el filtro) solo se puebla la tabla en
  // memoria (routesBySession), sin mostrar el panel ni dibujar nada en el
  // mapa: así "buscar por lugar" siempre puede saber a qué recorrido
  // pertenece cada pasada, aunque el usuario no haya filtrado por fecha
  // todavía. Solo cuando el usuario filtra explícitamente se muestra el
  // panel con la tabla y se marcan los recorridos encontrados.
  function loadRoutesTable(start, end) {
    clearRoutesTable();
    const autoShow = Boolean(start && end);
    routesTablePanel.classList.toggle("open", autoShow);

    let url = "/api/sessions";
    if (autoShow) {
      url += `?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
    }

    fetch(url)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          showAlert(data.error);
          return;
        }
        const sessions = data.sessions || [];

        sessions.forEach((s, i) => {
          routesBySession.set(s.session_id, {
            color: ROUTE_COLORS[i % ROUTE_COLORS.length],
            points: [],
            polyline: null,
            startMarker: null,
            endMarker: null,
            visible: false,
            loaded: false,
            loading: false,
          });

          const row = document.createElement("tr");
          row.dataset.sessionId = s.session_id;
          row.innerHTML = `
            <td><input type="checkbox"${autoShow ? " checked" : ""}></td>
            <td><span class="route-swatch" style="background:${ROUTE_COLORS[i % ROUTE_COLORS.length]}"></span>${s.start_time} → ${s.end_time}</td>
            <td>${s.points}</td>
          `;
          const checkbox = row.querySelector("input[type=checkbox]");
          checkbox.addEventListener("change", () => {
            setRouteVisible(s.session_id, checkbox.checked);
            syncTodosCheckbox();
          });
          routesTableBody.appendChild(row);
        });

        todosCheckbox.checked = autoShow && sessions.length > 0;
        updateHistoryViewState(); // refleja de una vez el caso "0 recorridos" del filtro

        if (autoShow) {
          sessions.forEach((s) => setRouteVisible(s.session_id, true));
        }

        renderPassageMarkers(); // la tabla cambió: re-filtra qué pasadas siguen visibles
      })
      .catch(() => showAlert("Error cargando la tabla de recorridos"));
  }
  loadRoutesTable();

  // --- Filtro por fecha de la tabla de recorridos históricos ---

  document.getElementById("filterRoutesByDate").addEventListener("click", () => {
    const start = document.getElementById("historyStart").value;
    const end = document.getElementById("historyEnd").value;

    if (!validateRange(start, end)) return;

    currentFilterLabel = `${start.replace("T", " ")} → ${end.replace("T", " ")}`;
    loadRoutesTable(start, end);
  });

  // "Limpiar búsqueda": quita la tabla, borra los recorridos dibujados y
  // resetea el intervalo de fechas — deja la sección de históricos como
  // recién abierta.
  document.getElementById("clearDateFilter").addEventListener("click", () => {
    document.getElementById("historyStart").value = "";
    document.getElementById("historyEnd").value = "";
    currentFilterLabel = null;
    loadRoutesTable();
  });

  // 1) Cargar el historial para dibujar el recorrido ya hecho antes de conectarnos en vivo.
  fetch("/api/history")
    .then((r) => r.json())
    .then((points) => {
      const latlngs = points.map((p) => [p.lat, p.lon]);
      trail.setLatLngs(latlngs);
      if (latlngs.length > 0) {
        const last = latlngs[latlngs.length - 1];
        marker.setLatLng(last);
        map.fitBounds(trail.getBounds(), { maxZoom: 15, padding: [20, 20] });
        mapCentered = true;
      }
    })
    .catch(() => {});

  // 2) Traer el último dato conocido para los campos de texto.
  fetch("/api/latest")
    .then((r) => r.json())
    .then((data) => {
      updateFields(data);
      if (data.lat !== null && data.lon !== null) {
        // No lo volvemos a añadir al trail: ya vino incluido en /api/history.
        updateMap(data.lat, data.lon, false);
      }
    })
    .catch(() => {});

  // 3) Suscribirse a las actualizaciones en vivo (Server-Sent Events) y extender el recorrido.
  const source = new EventSource("/events");

  source.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // El writer empezó una sesión/recorrido nuevo: borramos el trazo sin recargar.
    if (data.type === "session_start") {
      trail.setLatLngs([]);
      mapCentered = false;
      document.getElementById("status").textContent = "Nueva sesión de recorrido iniciada";
      return;
    }

    updateFields(data);
    if (data.lat !== null && data.lon !== null && !viewingHistory) {
      updateMap(data.lat, data.lon, true);
    }
  };

  source.onerror = () => {
    document.getElementById("dot").classList.remove("live");
    document.getElementById("status").textContent = "Connection lost — retrying…";
  };

  // ======================================================================
  // Búsqueda de "pasadas" por un lugar elegido en el mapa
  // ======================================================================

  const PASSAGE_RADIUS_M = 100;

  let pickingLocation = false;
  let placeMarker = null;
  let placeCircle = null;
  const passageMarkersLayer = L.layerGroup().addTo(map);
  let lastPassages = []; // última respuesta de /api/passages, con su session_id

  document.getElementById("pickLocationBtn").addEventListener("click", () => {
    pickingLocation = true;
    document.getElementById("status").textContent = "Haz clic en el mapa para elegir el punto…";
  });

  map.on("click", (e) => {
    if (!pickingLocation) return;
    pickingLocation = false;

    const { lat, lng } = e.latlng;

    if (placeMarker) map.removeLayer(placeMarker);
    if (placeCircle) map.removeLayer(placeCircle);

    placeMarker = L.marker([lat, lng]).addTo(map);
    placeCircle = L.circle([lat, lng], { radius: PASSAGE_RADIUS_M, color: "#8ecae6", fillOpacity: 0.08 }).addTo(map);

    document.getElementById("status").textContent = `Punto seleccionado: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  });

  // Vuelve a dibujar las pasadas ya encontradas, respetando qué recorridos
  // están marcados/visibles en la tabla en este momento. Se llama cada vez
  // que llegan pasadas nuevas Y cada vez que cambia una casilla de la
  // tabla, así una pasada desaparece del mapa si se desmarca su recorrido.
  function renderPassageMarkers() {
    passageMarkersLayer.clearLayers();

    lastPassages.forEach((p) => {
      // Si la pasada no tiene sesión asociada, o esa sesión no está
      // presente en la tabla actual (por ejemplo, todavía no se ha
      // filtrado por fecha), se muestra igual por defecto.
      const route = p.session_id ? routesBySession.get(p.session_id) : null;
      if (route && !route.visible) return; // su recorrido está desmarcado: se oculta

      L.circleMarker([p.lat, p.lon], { radius: 6, color: "#f4a261", fillOpacity: 0.9 })
        .bindPopup(`${p.start_gps_time} — ${p.end_gps_time}`)
        .addTo(passageMarkersLayer);
    });
  }

  document.getElementById("searchPassages").addEventListener("click", () => {
    if (!placeMarker) {
      showAlert("Primero selecciona un punto en el mapa");
      return;
    }

    const { lat, lng } = placeMarker.getLatLng();
    const banner = document.getElementById("passagesBanner");

    // Búsqueda por lugar: siempre sobre todo el histórico, sin filtro de fecha.
    const url = `/api/passages?lat=${lat}&lon=${lng}&radius=${PASSAGE_RADIUS_M}`;

    fetch(url)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          showAlert(data.error);
          return;
        }

        lastPassages = data.passages;
        renderPassageMarkers();

        if (data.passages.length === 0) {
          banner.style.display = "block";
          banner.innerHTML = "El camión no ha pasado por ese punto en el rango consultado.";
        } else {
          const items = data.passages.map((p) => {
            return p.start_received_at === p.end_received_at
              ? `<li>${p.start_received_at} (${p.points_count} lectura${p.points_count > 1 ? "s" : ""})</li>`
              : `<li>${p.start_received_at} → ${p.end_received_at} (${p.points_count} lecturas)</li>`;
          }).join("");

          banner.style.display = "block";
          banner.innerHTML = `<strong>${data.passages.length} pasada(s) encontrada(s):</strong><ul>${items}</ul>`;
        }

        document.getElementById("clearPassages").style.display = "inline-block";
      })
      .catch(() => showAlert("Error consultando las pasadas por ese punto"));
  });

  document.getElementById("clearPassages").addEventListener("click", () => {
    lastPassages = [];
    passageMarkersLayer.clearLayers();
    document.getElementById("passagesBanner").style.display = "none";
    document.getElementById("clearPassages").style.display = "none";

    if (placeMarker) { map.removeLayer(placeMarker); placeMarker = null; }
    if (placeCircle) { map.removeLayer(placeCircle); placeCircle = null; }
  });
</script>

</body>
</html>
