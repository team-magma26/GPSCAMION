<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }} — Live</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #0d1b2a;
    --card: #1b263b;
    --border: #2a3a55;
    --accent: #8ecae6;
    --accent-soft: rgba(142, 202, 230, 0.12);
    --muted: #6c7a91;
    --live: #2ecc71;
    --history: #f4a261;
    --history-soft: rgba(244, 162, 97, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: #ffffff;
    margin: 0;
    padding-bottom: 40px;
  }

  /* ---------- Barra de título ---------- */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .topbar-inner {
    width: 94%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo {
    width: 48px; height: 48px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--accent);
  }
  .logo svg { width: 28px; height: 28px; }
  .titles { flex: 1; min-width: 200px; }
  h1 { font-size: 22px; color: var(--accent); margin: 0; letter-spacing: .3px; }
  .role {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2); }

  /* ---------- Contenido ---------- */
  .wrap { width: 94%; max-width: 1100px; margin: 22px auto 0; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 16px 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    margin-bottom: 14px;
  }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group.grow { flex: 1; }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: bold;
  }
  .group-body { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--accent); }
  .divider { width: 1px; align-self: stretch; background: var(--border); }

  /* Interruptor "Seguir camión" */
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .slider {
    width: 38px; height: 22px; border-radius: 999px;
    background: var(--border);
    position: relative;
    transition: background .2s;
  }
  .slider::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted);
    transition: transform .2s, background .2s;
  }
  .switch input:checked + .slider { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .switch input:checked + .slider::after { transform: translateX(16px); background: var(--accent); }

  .date-field { display: flex; align-items: center; gap: 8px; }
  input[type="datetime-local"] {
    background: var(--bg);
    color: #ffffff;
    color-scheme: dark;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input[type="datetime-local"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    background: var(--border);
    color: var(--accent);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #33456a; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.primary:hover { background: #a4d6ec; }
  .btn.history { background: var(--history-soft); color: var(--history); border-color: var(--history); }
  .btn.history:hover { background: rgba(244, 162, 97, 0.22); }

  #historyBanner {
    display: none;
    background: var(--history-soft);
    border: 1px solid var(--history);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  #passagesBanner {
    display: none;
    background: var(--history-soft);
    border: 1px solid var(--history);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  #passagesBanner ul { margin: 8px 0 0 18px; padding: 0; }
  #passagesBanner li { margin-bottom: 4px; }

  /* ---------- Modal de validación (reemplaza los alert() nativos) ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    padding: 22px 24px;
    max-width: 380px;
    width: 90%;
  }
  .modal-card p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #ffffff;
  }
  .modal-card .btn { width: 100%; }

  /* ---------- Selector de recorridos guardados ---------- */
  select.session-select {
    background: var(--bg);
    color: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    max-width: 260px;
  }

  /* ---------- Leyenda de recorridos históricos superpuestos ---------- */
  #routesLegend {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  #routesLegend .route-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px 6px 8px;
    font-size: 12px;
    color: #ffffff;
  }
  #routesLegend .route-color {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  #routesLegend .route-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
  }
  #routesLegend .route-remove:hover { color: #ffffff; }

  /* Marcadores de inicio/fin de cada recorrido histórico */
  .route-endpoint {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: #0d1b2a;
    font-weight: bold;
    font-size: 11px;
    border: 2px solid #0d1b2a;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }

  #map {
    width: 100%;
    height: 560px;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  /* Camión como marcador del mapa */
  .truck-pin {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--accent);
    color: var(--accent);
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .truck-pin svg { width: 22px; height: 22px; }

  /* Tarjeta "Posición Actual" */
  .stats-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    padding: 16px 22px;
    margin-top: 18px;
  }
  .stats-card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 14px;
  }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .label {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: bold;
  }
  .value { font-family: "Courier New", monospace; font-size: 20px; }

  @media (max-width: 760px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    #map { height: 420px; }
    .divider { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" id="logoIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6h13v10H1z"/>
        <path d="M14 9h4l3 3v4h-7z"/>
        <circle cx="6" cy="18" r="2"/>
        <circle cx="17" cy="18" r="2"/>
      </svg>
    </div>
    <div class="titles">
      <h1>{{ app_name }}</h1>
      <span class="role">modo: {{ role }}</span>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  </div>
</header>

<main class="wrap">

  <section class="panel">
    <div class="group">
      <span class="group-title">En vivo</span>
      <div class="group-body">
        <label class="switch">
          <input type="checkbox" id="followToggle" checked>
          <span class="slider"></span>
          Seguir camión
        </label>
        <button class="btn" id="clearTrail">Limpiar recorrido</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="group grow">
      <span class="group-title">Recorrido histórico</span>
      <div class="group-body">
        <label class="date-field">Desde <input type="datetime-local" id="rangeStart"></label>
        <label class="date-field">Hasta <input type="datetime-local" id="rangeEnd"></label>
        <button class="btn primary" id="searchHistory">Agregar recorrido</button>
        <button class="btn history" id="backToLive" style="display:none;">Limpiar y volver a en vivo</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="group grow">
      <span class="group-title">Recorridos guardados</span>
      <div class="group-body">
        <select id="sessionSelect" class="session-select">
          <option value="">Cargando recorridos…</option>
        </select>
        <button class="btn primary" id="viewSavedSession">Agregar al mapa</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="group grow">
      <span class="group-title">Buscar por lugar</span>
      <div class="group-body">
        <button class="btn" id="pickLocationBtn">Seleccionar punto en el mapa</button>
        <button class="btn primary" id="searchPassages">Buscar pasadas</button>
        <button class="btn history" id="clearPassages" style="display:none;">Limpiar búsqueda</button>
      </div>
    </div>
  </section>

  <div id="historyBanner"></div>
  <div id="routesLegend"></div>
  <div id="passagesBanner"></div>

  <div id="map"></div>

  <section class="stats-card">
    <div class="stats-card-title">Posición Actual</div>
    <div class="stats-grid">
      <div><span class="label">Latitud</span><span class="value" id="lat">--</span></div>
      <div><span class="label">Longitud</span><span class="value" id="lon">--</span></div>
      <div><span class="label">Fecha</span><span class="value" id="date">--</span></div>
      <div><span class="label">Hora</span><span class="value" id="time">--</span></div>
    </div>
  </section>

</main>

<div class="modal-overlay" id="appModal">
  <div class="modal-card">
    <p id="modalMessage"></p>
    <button class="btn primary" id="modalOk">Entendido</button>
  </div>
</div>

<script>

  const map = L.map("map").setView([4.6, -74.08], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // El marcador reutiliza el mismo ícono de camión de la barra de título.
  const truckIcon = L.divIcon({
    className: "",
    html: '<div class="truck-pin">' + document.getElementById("logoIcon").innerHTML + "</div>",
    iconSize: [40, 40],
    iconAnchor: [20, 20],
  });
  const marker = L.marker([4.6, -74.08], { icon: truckIcon }).addTo(map);

  // Recorrido real del vehículo en tiempo real.
  const trail = L.polyline([], { color: "#2ecc71", weight: 4, opacity: 0.85 }).addTo(map);

  // Recorridos históricos superpuestos (rango de fechas o recorrido guardado).
  // Cada uno se dibuja con su propio color para poder compararlos en el mapa.
  const ROUTE_COLORS = ["#c2410c", "#2ecc71", "#8ecae6", "#e63946", "#ffb703", "#9b5de5", "#00b4d8", "#f4a261"];
  const historyRoutes = [];
  let routeCounter = 0;
  const routesLayer = L.layerGroup().addTo(map);

  // --- Modal de validación (reemplaza los alert() nativos) ---
  const appModal = document.getElementById("appModal");
  const modalMessage = document.getElementById("modalMessage");
  document.getElementById("modalOk").addEventListener("click", () => appModal.classList.remove("open"));
  function showAlert(message) {
    modalMessage.textContent = message;
    appModal.classList.add("open");
  }

  function endpointIcon(letter, color) {
    return L.divIcon({
      className: "",
      html: `<div class="route-endpoint" style="background:${color}">${letter}</div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
    });
  }

  function renderRoutesLegend() {
    const legend = document.getElementById("routesLegend");
    if (historyRoutes.length === 0) {
      legend.style.display = "none";
      legend.innerHTML = "";
      return;
    }
    legend.style.display = "flex";
    legend.innerHTML = historyRoutes.map((r) => `
      <span class="route-chip">
        <span class="route-color" style="background:${r.color}"></span>
        ${r.label}
        <button class="route-remove" data-route-id="${r.id}" title="Quitar este recorrido">✕</button>
      </span>
    `).join("");
    legend.querySelectorAll(".route-remove").forEach((btn) => {
      btn.addEventListener("click", () => removeHistoryRoute(Number(btn.dataset.routeId)));
    });
  }

  function addHistoryRoute(points, label) {
    const latlngs = points.map((p) => [p.lat, p.lon]);
    const color = ROUTE_COLORS[routeCounter % ROUTE_COLORS.length];
    const id = routeCounter++;

    const polyline = L.polyline(catmullRomSpline(latlngs, 8), {
      color, weight: 4, opacity: 0.9, smoothFactor: 1.5,
    }).addTo(routesLayer);

    let startMarker = null;
    let endMarker = null;
    if (points.length > 0) {
      const first = points[0];
      const last = points[points.length - 1];

      startMarker = L.marker([first.lat, first.lon], { icon: endpointIcon("A", color) })
        .bindPopup(`<strong>Inicio</strong><br>${first.time}<br>Lat: ${first.lat.toFixed(5)}, Lon: ${first.lon.toFixed(5)}`)
        .addTo(routesLayer);

      endMarker = L.marker([last.lat, last.lon], { icon: endpointIcon("B", color) })
        .bindPopup(`<strong>Fin</strong><br>${last.time}<br>Lat: ${last.lat.toFixed(5)}, Lon: ${last.lon.toFixed(5)}`)
        .addTo(routesLayer);
    }

    historyRoutes.push({ id, polyline, startMarker, endMarker, color, label });
    renderRoutesLegend();

    viewingHistory = true;
    trail.setLatLngs([]); // oculta el trazo en vivo mientras se ve el histórico
    document.getElementById("backToLive").style.display = "inline-block";

    if (latlngs.length > 0) {
      const allBounds = L.featureGroup(historyRoutes.map((r) => r.polyline)).getBounds();
      map.fitBounds(allBounds, { maxZoom: 15, padding: [20, 20] });
    }

    return points.length;
  }

  function removeHistoryRoute(id) {
    const idx = historyRoutes.findIndex((r) => r.id === id);
    if (idx === -1) return;
    const [route] = historyRoutes.splice(idx, 1);
    routesLayer.removeLayer(route.polyline);
    if (route.startMarker) routesLayer.removeLayer(route.startMarker);
    if (route.endMarker) routesLayer.removeLayer(route.endMarker);
    renderRoutesLegend();

    if (historyRoutes.length === 0) {
      backToLiveView();
    }
  }

  function clearHistoryRoutes() {
    routesLayer.clearLayers();
    historyRoutes.length = 0;
    renderRoutesLegend();
  }

  function backToLiveView() {
    viewingHistory = false;
    clearHistoryRoutes();
    document.getElementById("backToLive").style.display = "none";
    document.getElementById("historyBanner").style.display = "none";

    fetch("/api/history")
      .then((r) => r.json())
      .then((points) => trail.setLatLngs(points.map((p) => [p.lat, p.lon])));
  }

  let mapCentered = false;
  let followTruck = true;
  let viewingHistory = false;

  const followToggle = document.getElementById("followToggle");
  followToggle.addEventListener("change", () => {
    followTruck = followToggle.checked;

    if (followTruck) {
      map.panTo(marker.getLatLng());
    }
  });

  map.on("dragstart", () => {
    followTruck = false;
    followToggle.checked = false;
  });

  document.getElementById("clearTrail").addEventListener("click", () => {
    trail.setLatLngs([]);
  });

  function updateFields(data) {
    document.getElementById("lat").textContent  = data.lat  !== null ? data.lat  : "--";
    document.getElementById("lon").textContent  = data.lon  !== null ? data.lon  : "--";
    document.getElementById("date").textContent = data.date !== null ? data.date : "--";
    document.getElementById("time").textContent = data.time !== null ? data.time : "--";
    document.getElementById("status").textContent = "Live — last update " + new Date().toLocaleTimeString();
    document.getElementById("dot").classList.add("live");
  }

  function updateMap(lat, lon, addToTrail = true) {
    const point = [lat, lon];
    marker.setLatLng(point);

    if (addToTrail) {
      trail.addLatLng(point);
    }

    if (!mapCentered) {
      map.setView(point, 15);
      mapCentered = true;
    } else if (followTruck) {
      map.panTo(point, { animate: true, duration: 0.5 });
    }
  }

  // Suavizado tipo Catmull-Rom: convierte puntos "en zigzag" (ruido normal
  // del GPS) en una curva más natural. Corre en el navegador del usuario.
  function catmullRomSpline(points, segments = 8) {
    if (points.length < 3) return points;
    const result = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? i : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

      for (let t = 0; t < segments; t++) {
        const st = t / segments, st2 = st * st, st3 = st2 * st;
        const lat = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * st +
          (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * st2 +
          (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * st3);
        const lon = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * st +
          (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * st2 +
          (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * st3);
        result.push([lat, lon]);
      }
    }
    result.push(points[points.length - 1]);
    return result;
  }

  // --- Calendario bloqueado: nunca se puede elegir una fecha/hora futura ---

  function localDatetimeString(date) {
    const offsetMs = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offsetMs).toISOString().slice(0, 16);
  }

  function updateDateLimits() {
    const nowStr = localDatetimeString(new Date());
    document.getElementById("rangeStart").max = nowStr;
    document.getElementById("rangeEnd").max = nowStr;
  }
  updateDateLimits();
  setInterval(updateDateLimits, 30000);

  // --- Validación del rango de fecha/hora elegido, con popup en vez de alert() nativo ---

  function validateRange(start, end) {
    if (!start || !end) {
      showAlert("Selecciona fecha y hora de inicio y fin.");
      return false;
    }

    const nowStr = localDatetimeString(new Date());
    if (start > nowStr) {
      showAlert("La fecha/hora 'Desde' no puede ser futura.");
      return false;
    }
    if (end > nowStr) {
      showAlert("La fecha/hora 'Hasta' no puede ser futura.");
      return false;
    }
    if (start > end) {
      showAlert("La fecha/hora 'Desde' no puede ser posterior a 'Hasta'.");
      return false;
    }
    return true;
  }

  // --- Búsqueda de recorrido histórico por rango de fecha/hora ---

  document.getElementById("searchHistory").addEventListener("click", () => {
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    const banner = document.getElementById("historyBanner");

    if (!validateRange(start, end)) return;

    fetch(`/api/history_range?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          showAlert(data.error);
          return;
        }

        const label = `${start.replace("T", " ")} → ${end.replace("T", " ")}`;
        const count = addHistoryRoute(data.points, label);

        banner.style.display = "block";
        banner.textContent = count > 0
          ? `Recorrido agregado: ${count} puntos entre ${label}`
          : `No hay puntos registrados entre ${label}`;
      })
      .catch(() => showAlert("Error consultando el historial"));
  });

  document.getElementById("backToLive").addEventListener("click", backToLiveView);

  // --- Recorridos guardados (sesiones ya registradas) ---

  const sessionSelect = document.getElementById("sessionSelect");

  fetch("/api/sessions")
    .then((r) => r.json())
    .then((data) => {
      sessionSelect.innerHTML = "";
      if (!data.sessions || data.sessions.length === 0) {
        sessionSelect.innerHTML = '<option value="">No hay recorridos guardados</option>';
        return;
      }
      data.sessions.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.session_id;
        opt.textContent = `${s.start_time} → ${s.end_time} (${s.points} pts)`;
        sessionSelect.appendChild(opt);
      });
    })
    .catch(() => {
      sessionSelect.innerHTML = '<option value="">Error cargando recorridos</option>';
    });

  document.getElementById("viewSavedSession").addEventListener("click", () => {
    const sessionId = sessionSelect.value;
    if (!sessionId) {
      showAlert("Selecciona un recorrido guardado de la lista.");
      return;
    }

    const label = sessionSelect.options[sessionSelect.selectedIndex].textContent;

    fetch(`/api/session_route?session_id=${encodeURIComponent(sessionId)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          showAlert(data.error);
          return;
        }
        const count = addHistoryRoute(data.points, label);
        const banner = document.getElementById("historyBanner");
        banner.style.display = "block";
        banner.textContent = count > 0
          ? `Recorrido guardado agregado: ${count} puntos (${label})`
          : `Ese recorrido guardado no tiene puntos`;
      })
      .catch(() => showAlert("Error consultando el recorrido guardado"));
  });

  // 1) Cargar el historial para dibujar el recorrido ya hecho antes de conectarnos en vivo.
  fetch("/api/history")
    .then((r) => r.json())
    .then((points) => {
      const latlngs = points.map((p) => [p.lat, p.lon]);
      trail.setLatLngs(latlngs);
      if (latlngs.length > 0) {
        const last = latlngs[latlngs.length - 1];
        marker.setLatLng(last);
        map.fitBounds(trail.getBounds(), { maxZoom: 15, padding: [20, 20] });
        mapCentered = true;
      }
    })
    .catch(() => {});

  // 2) Traer el último dato conocido para los campos de texto.
  fetch("/api/latest")
    .then((r) => r.json())
    .then((data) => {
      updateFields(data);
      if (data.lat !== null && data.lon !== null) {
        // No lo volvemos a añadir al trail: ya vino incluido en /api/history.
        updateMap(data.lat, data.lon, false);
      }
    })
    .catch(() => {});

  // 3) Suscribirse a las actualizaciones en vivo (Server-Sent Events) y extender el recorrido.
  const source = new EventSource("/events");

  source.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // El writer empezó una sesión/recorrido nuevo: borramos el trazo sin recargar.
    if (data.type === "session_start") {
      trail.setLatLngs([]);
      mapCentered = false;
      document.getElementById("status").textContent = "Nueva sesión de recorrido iniciada";
      return;
    }

    updateFields(data);
    if (data.lat !== null && data.lon !== null && !viewingHistory) {
      updateMap(data.lat, data.lon, true);
    }
  };

  source.onerror = () => {
    document.getElementById("dot").classList.remove("live");
    document.getElementById("status").textContent = "Connection lost — retrying…";
  };

  // --- Búsqueda de "pasadas" por un lugar elegido en el mapa ---

  const PASSAGE_RADIUS_M = 100;

  let pickingLocation = false;
  let placeMarker = null;
  let placeCircle = null;
  const passageMarkersLayer = L.layerGroup().addTo(map);

  document.getElementById("pickLocationBtn").addEventListener("click", () => {
    pickingLocation = true;
    document.getElementById("status").textContent = "Haz clic en el mapa para elegir el punto…";
  });



  map.on("click", (e) => {
    if (!pickingLocation) return;
    pickingLocation = false;

    const { lat, lng } = e.latlng;

    if (placeMarker) map.removeLayer(placeMarker);
    if (placeCircle) map.removeLayer(placeCircle);

    placeMarker = L.marker([lat, lng]).addTo(map);
    placeCircle = L.circle([lat, lng], { radius: PASSAGE_RADIUS_M, color: "#8ecae6", fillOpacity: 0.08 }).addTo(map);

    document.getElementById("status").textContent = `Punto seleccionado: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  });

  document.getElementById("searchPassages").addEventListener("click", () => {
    if (!placeMarker) {
      showAlert("Primero selecciona un punto en el mapa");
      return;
    }

    const { lat, lng } = placeMarker.getLatLng();
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    const banner = document.getElementById("passagesBanner");

    if ((start && !end) || (!start && end)) {
      showAlert("Si vas a acotar por fecha, selecciona tanto 'Desde' como 'Hasta'.");
      return;
    }
    if (start && end && !validateRange(start, end)) return;

    let url = `/api/passages?lat=${lat}&lon=${lng}&radius=${PASSAGE_RADIUS_M}`;
    if (start && end) {
      url += `&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
    }

    fetch(url)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) {
          showAlert(data.error);
          return;
        }

        passageMarkersLayer.clearLayers();

        if (data.passages.length === 0) {
          banner.style.display = "block";
          banner.innerHTML = "El camión no ha pasado por ese punto en el rango consultado.";
        } else {
          const items = data.passages.map((p) => {
            L.circleMarker([p.lat, p.lon], { radius: 6, color: "#f4a261", fillOpacity: 0.9 })
              .bindPopup(`${p.start_gps_time} — ${p.end_gps_time}`)
              .addTo(passageMarkersLayer);

            return p.start_received_at === p.end_received_at
              ? `<li>${p.start_received_at} (${p.points_count} lectura${p.points_count > 1 ? "s" : ""})</li>`
              : `<li>${p.start_received_at} → ${p.end_received_at} (${p.points_count} lecturas)</li>`;
          }).join("");

          banner.style.display = "block";
          banner.innerHTML = `<strong>${data.passages.length} pasada(s) encontrada(s):</strong><ul>${items}</ul>`;
        }

        document.getElementById("clearPassages").style.display = "inline-block";
      })
      .catch(() => showAlert("Error consultando las pasadas por ese punto"));
  });

  document.getElementById("clearPassages").addEventListener("click", () => {
    passageMarkersLayer.clearLayers();
    document.getElementById("passagesBanner").style.display = "none";
    document.getElementById("clearPassages").style.display = "none";

    if (placeMarker) { map.removeLayer(placeMarker); placeMarker = null; }
    if (placeCircle) { map.removeLayer(placeCircle); placeCircle = null; }
  });
</script>

</body>
</html>
